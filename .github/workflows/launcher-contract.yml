name: launcher-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify standard scripts
        run: |
          test -f install.sh
          test -f run.sh
          test -f cli.sh
          test -f project_gui.py
          test ! -f doit.sh
          test -x test.sh
          bash -n install.sh run.sh cli.sh test.sh
          python -m py_compile project_gui.py
          grep -q 'install.sh' run.sh
          grep -q 'project_gui.py' run.sh
          grep -qi 'PySide6' install.sh
          grep -q 'cli.sh' README.md
      - name: Exercise GUI actions offscreen
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install -e . PySide6
          QT_QPA_PLATFORM=offscreen PROJECT_GUI_SMOKE=1 ./run.sh
          QT_QPA_PLATFORM=offscreen ./.venv/bin/python -m tests.gui_smoke
